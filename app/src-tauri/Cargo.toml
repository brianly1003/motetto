[package]
name = "motetto-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
motetto-core = { path = "../../crates/motetto-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
ts-rs = "12"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSURL", "NSError", "NSArray", "NSLocale", "NSSet", "NSEnumerator", "NSOperation"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioFile", "AVAudioFormat", "AVAudioMixerNode", "AVAudioNode", "AVAudioPlayerNode", "AVAudioTime", "AVAudioTypes", "AVAudioUnit", "AVAudioUnitEffect", "AVAudioUnitTimeEffect", "AVAudioUnitTimePitch", "AVAudioIONode", "AVAudioMixing", "AVAudioBuffer"] }
# Script following (SPEC 14.5): Apple's on-device recogniser; the platform API is the only way in.
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionTask", "SFSpeechRecognitionResult", "SFTranscription", "SFTranscriptionSegment", "SFSpeechRecognitionTaskHint"] }
