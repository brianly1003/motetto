[package]
name = "motetto-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
dotenvy = "0.15"
hound = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["aac", "mp3", "isomp4", "wav", "pcm", "flac", "aiff", "ogg", "vorbis", "alac"] }
ts-rs = "12"
ureq = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBase"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSError", "NSArray"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSScreen", "NSGraphics", "objc2-core-foundation"] }
screencapturekit = { version = "11", features = ["macos_15_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Performance"] }
